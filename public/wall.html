<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offers</title>
<style>
  html, body { margin: 0; background: #0b0b0e; color: #ecece6; }
  body { padding: 14px 10px 24px; }
  #wall-note { display: none; max-width: 30em; margin: 48px auto; text-align: center; font: 15px/1.5 system-ui, sans-serif; color: #c9c9c2; }
  #wall-note strong { display: block; margin-bottom: 6px; color: #ecece6; font-size: 17px; }
</style>
</head>
<body>
<script>
  // The CPAGrip script renders the wall inline, right where it is included.
  // It uses document.write, so it has to be a synchronous script tag in the body.
  var uid = new URLSearchParams(location.search).get('uid') || '';
  var valid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(uid);
  var src = 'https://doctoredits.com/script_include.php?id=1917436' + (valid ? '&tracking_id=' + encodeURIComponent(uid) : '');
  document.write('<scr' + 'ipt src="' + src + '"></scr' + 'ipt>');
</script>
<div id="wall-note"></div>
<script>
  // The wall renders blank both when the script can't load and when the network has no offers for this visitor.
  // Say which one it is, so a blank box isn't a mystery.
  (function () {
    var note = document.getElementById('wall-note');
    function show(title, body) {
      note.innerHTML = '<strong></strong><span></span>';
      note.firstChild.textContent = title;
      note.lastChild.textContent = body;
      note.style.display = 'block';
    }
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      var list = document.getElementById('offerlst');
      var hasRows = list && list.querySelector('table a, a');
      if (hasRows) { clearInterval(timer); return; }
      if (typeof window.lck === 'undefined' && tries >= 8) {
        clearInterval(timer);
        show('The offer script didn\u2019t load', 'Something is blocking doctoredits.com (an ad blocker, privacy extension or network filter). Allow it for this site, or open the offers in their own tab.');
      } else if (window.preload_data && tries >= 8 && !(window.preload_data.items && window.preload_data.items.length)) {
        clearInterval(timer);
        show('No offers for your location right now', 'Offers are targeted by country, and CPAGrip has none to show for where you are. Check back later.');
      } else if (tries >= 20) {
        clearInterval(timer);
        show('Still nothing', 'The wall hasn\u2019t returned any offers. Try reloading, or open it in its own tab.');
      }
    }, 1000);
  })();
</script>
</body>
</html>
