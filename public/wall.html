<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offers</title>
<style>
  html, body { margin: 0; background: #0b0b0e; color: #ecece6; }
  body { padding: 14px 10px 24px; }
  #wall-status { display: none; max-width: 520px; margin: 40px auto; padding: 18px 20px; border: 1px solid rgb(255 255 255 / .15);
    border-radius: 16px; font: 15px/1.5 system-ui, sans-serif; color: #c9c9c2; text-align: center; }
  #wall-status b { color: #ecece6; }
</style>
</head>
<body>
<script>
  // The CPAGrip script renders the wall inline, right where it is included.
  // It uses document.write, so it has to be a synchronous script tag in the body.
  var uid = new URLSearchParams(location.search).get('uid') || '';
  var valid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(uid);
  var src = 'https://doctoredits.com/script_include.php?id=1917436' + (valid ? '&tracking_id=' + encodeURIComponent(uid) : '');
  document.write('<scr' + 'ipt src="' + src + '" onerror="window.wallBlocked=true"></scr' + 'ipt>');
</script>
<div id="wall-status" role="status"></div>
<script>
  // The wall is third-party and renders nothing when its script is blocked or when it has no offers for this
  // visitor's country/device. Say so instead of leaving a blank page.
  setTimeout(function () {
    if (document.querySelector('a.link_a')) return;
    var el = document.getElementById('wall-status');
    el.innerHTML = window.wallBlocked || typeof Start_Ajax === 'undefined'
      ? '<b>The offer wall was blocked from loading.</b><br>An ad blocker, tracking protection or private DNS is probably blocking doctoredits.com. Turn it off for this site, or try another browser or network, then reload.'
      : '<b>No offers are available for you right now.</b><br>The offer network picks offers by country and device. Try again later or from a different connection.';
    el.style.display = 'block';
  }, 6000);
</script>
</body>
</html>
